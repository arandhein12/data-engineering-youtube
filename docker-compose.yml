services:

  # ----------------------------
  # ZOOKEEPER
  # ----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'bash', '-c', "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - confluent

  # ----------------------------
  # KAFKA BROKER
  # ----------------------------
  broker:
    image: confluentinc/cp-server:7.4.0
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'

    healthcheck:
      test: ['CMD', 'bash', '-c', 'nc -z localhost 9092']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - confluent

  # ----------------------------
  # SCHEMA REGISTRY
  # ----------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081']
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - confluent

  # ----------------------------
  # CONTROL CENTER
  # ----------------------------
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0
    hostname: control-center
    container_name: control-center

    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

    ports:
      - "9021:9021"

    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      PORT: 9021

    networks:
      - confluent

  # ----------------------------
  # AIRFLOW WEBSERVER
  # ----------------------------
  webserver:
    image: apache/airflow:2.6.0-python3.9
    command: webserver
    entrypoint:
      - /bin/bash
      - /opt/airflow/scripts/entrypoint.sh

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=this_is_a_very_secured_key

    logging:
      options:
        max-size: 10m
        max-file: "3"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/scripts/entrypoint.sh
      - ./requirements.txt:/opt/airflow/requirements.txt

    ports:
      - "8082:8080"

    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

    networks:
      - confluent

  # ----------------------------
  # AIRFLOW SCHEDULER
  # ----------------------------
  scheduler:
    image: apache/airflow:2.6.0-python3.9

    depends_on:
      webserver:
        condition: service_healthy

    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/opt/airflow/requirements.txt

    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=this_is_a_very_secured_key

    command: >
      bash -c "pip install --user -r /opt/airflow/requirements.txt
      && airflow db upgrade
      && exec airflow scheduler"

    networks:
      - confluent

  # ----------------------------
  # POSTGRESQL
  # ----------------------------
  postgres:
    image: postgres:14.0

    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow

    logging:
      options:
        max-size: 10m
        max-file: "3"

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow -d airflow']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - confluent

  # ----------------------------
  # SPARK MASTER
  # ----------------------------
  spark-master:
    image: apache/spark:3.5.7-python3
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"

    ports:
      - "9090:8080"
      - "7077:7077"

    networks:
      - confluent

  # ----------------------------
  # SPARK WORKER
  # ----------------------------
  spark-worker:
    image: apache/spark:3.5.7-python3
    hostname: spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      - spark-master

    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1g"

    networks:
      - confluent

  # ----------------------------
  # CASSANDRA DATABASE
  # ----------------------------
  cassandra_db:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra

    ports:
      - "127.0.0.1:9042:9042"

    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
      CASSANDRA_CLUSTER_NAME: DataEngineeringCluster

    volumes:
      - cassandra_data:/var/lib/cassandra

    networks:
      - confluent

# ----------------------------
# NETWORKS
# ----------------------------
networks:
  confluent:
    driver: bridge

# ----------------------------
# VOLUMES
# ----------------------------
volumes:
  cassandra_data: